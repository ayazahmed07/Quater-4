name: PSX Bot Check

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch:      # Allows manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run PSX Bot
        env:
          WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID || 'instance168787' }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN || 'fposw4le00f7yreu' }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE || '923322894427' }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add last.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last announcement" && git push)
